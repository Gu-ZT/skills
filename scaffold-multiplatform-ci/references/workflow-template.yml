name: CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  # Replace repository-specific commands and paths before using this file.

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
          - runner: windows-latest
            platform: windows
          - runner: macos-14
            platform: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install native prerequisites
        shell: bash
        run: ./ci/install-${{ matrix.platform }}.sh
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.platform }}-quality
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm run web:build

  integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Start integration services
        run: |
          docker compose -f ci/compose.yml up -d
          ./ci/wait-for-services.sh
      - name: Run integration tests
        run: cargo test --locked -- --ignored --test-threads=1
      - name: Collect logs
        if: always()
        run: docker compose -f ci/compose.yml logs
      - name: Stop services
        if: always()
        run: docker compose -f ci/compose.yml down --volumes

  prepare:
    needs: [quality, integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      changelog_version: ${{ steps.release.outputs.changelog_version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve idempotent release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # Resolve default-branch pushes as unique prereleases and exact version tags as stable releases.
        # Keep the release draft until update-release-notes publishes it after every build succeeds.
        run: ./ci/resolve-release.sh "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            cache_key: windows-x86_64
            bundle_args: --bundles nsis
          - platform: windows
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            cache_key: windows-aarch64
            bundle_args: --bundles nsis
          - platform: linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cache_key: linux-x86_64
            bundle_args: --bundles deb,appimage
          - platform: linux
            runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            cache_key: linux-aarch64
            bundle_args: --bundles deb,appimage
          - platform: macos
            runner: macos-14
            target: aarch64-apple-darwin
            cache_key: macos-aarch64
            bundle_args: --bundles app,dmg
          - platform: macos
            runner: macos-13
            target: x86_64-apple-darwin
            cache_key: macos-x86_64
            bundle_args: --bundles app,dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Install platform prerequisites
        shell: bash
        run: ./ci/install-${{ matrix.platform }}.sh
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.cache_key }}-release
      - run: pnpm install --frozen-lockfile
      - name: Package and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target ${{ matrix.target }} ${{ matrix.bundle_args }}

  update-release-notes:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render bilingual architecture download table
        run: ./ci/update-release-notes.sh ${{ needs.prepare.outputs.release_id }} ${{ needs.prepare.outputs.tag }}
